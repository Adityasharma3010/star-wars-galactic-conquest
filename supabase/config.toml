project_id = 'star-wars-galactic-conquest'

[api]
enabled = true
port = 54321
schemas = ['public', 'graphql_public']
extra_search_path = ['public', 'extensions']
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ['./seed.sql']

[auth]
enabled = true
site_url = 'https://monopoly.adityasharma.site'
additional_redirect_urls = [
  'https://monopoly.adityasharma.site',
  'https://star-wars-galactic-conquest.vercel.app',
  'http://localhost:5174',
  'http://localhost:5173'
]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = '5MiB'

[functions.galactic-api]
enabled = true
verify_jwt = false
entrypoint = './functions/galactic-api/index.js'
